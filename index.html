<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Planificador de Redes</title>
<style>
  :root{
    --bg:#faf7f5; --card:#fff; --ink:#2b2523; --muted:#8a7f7b; --line:#ece4df;
    --accent:#e2725b; --accent-soft:#fbe9e4; --dark:#1f1b1a; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px}
  button:hover{border-color:#d6cbc5}
  button.primary{background:var(--dark);color:#fff;border-color:var(--dark)}
  button.ghost{border-color:transparent;background:transparent}
  button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
  textarea{resize:vertical;min-height:140px;line-height:1.45}
  label{font-size:12px;color:var(--muted);display:block;margin:12px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}

  header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0 8px 0 0;min-width:170px;text-transform:capitalize}
  .spacer{flex:1}
  .seg{display:flex;gap:4px}
  main{padding:16px 18px}

  /* Calendario mes */
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .dow{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;padding:0 4px 4px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);min-height:118px;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;overflow:hidden}
  .day.other{opacity:.45}
  .day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .day .num{font-size:12px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
  .day.today .num span:first-child{background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center}
  .more{font-size:11px;color:var(--muted);margin-top:auto}

  .chip{display:flex;align-items:center;gap:6px;background:#fbf9f8;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:11px;cursor:pointer;min-width:0}
  .chip:hover{border-color:var(--accent)}
  .chip img{width:22px;height:22px;object-fit:cover;border-radius:4px;flex:none}
  .chip .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip .time{color:var(--muted);font-size:10px}
  .dots{display:flex;gap:2px;flex:none}
  .dot{width:7px;height:7px;border-radius:50%}
  .status-dot{width:7px;height:7px;border-radius:50%;flex:none}

  /* Semana */
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .week .day{min-height:380px}

  /* Pipeline */
  .pipe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .col{background:#f3eeeb;border-radius:var(--radius);padding:10px;min-height:300px}
  .col h3{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
  .card .meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;align-items:center}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(30,24,22,.45);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:30px 12px}
  .overlay.open{display:flex}
  .modal{background:var(--card);border-radius:16px;width:min(1100px,100%);display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
  .modal .left{padding:20px;border-right:1px solid var(--line)}
  .modal .right{padding:20px;background:#f7f3f1;max-height:85vh;overflow:auto}
  .modal h2{margin:0 0 4px;font-size:18px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .nets{display:flex;flex-wrap:wrap;gap:6px}
  .net-btn{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:20px;font-size:12px}
  .net-btn.on{color:#fff}
  .counter{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
  .imgprev{margin-top:8px;display:flex;gap:8px;align-items:center}
  .imgprev img{max-height:70px;border-radius:8px}
  .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .danger{color:#c0392b}

  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
  .preview{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:420px;margin:0 auto}
  .pv-head{display:flex;align-items:center;gap:8px;padding:10px 12px}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#f6b49c,#e2725b)}
  .pv-name{font-weight:700;font-size:13px}
  .pv-sub{font-size:11px;color:var(--muted)}
  .pv-img{width:100%;display:block;background:#eee}
  .pv-img.ph{aspect-ratio:1/1;display:grid;place-items:center;color:var(--muted);font-size:12px}
  .pv-text{padding:10px 12px;white-space:pre-wrap;word-wrap:break-word;font-size:13px;line-height:1.45}
  .pv-text .cut{background:#fde2dd;color:#b03a2e}
  .warn{background:#fff4e5;border:1px solid #f5d29a;color:#8a5a00;border-radius:8px;padding:8px 10px;font-size:12px;margin:10px auto 0;max-width:420px}
  .ok{background:#e9f7ef;border:1px solid #b7e2c7;color:#1e7a46;border-radius:8px;padding:8px 10px;font-size:12px;margin:10px auto 0;max-width:420px}
  .custom-box{max-width:420px;margin:12px auto 0}
  .custom-box textarea{min-height:90px}
  .pubrow{display:flex;align-items:center;justify-content:space-between;max-width:420px;margin:10px auto 0;gap:8px}
  .hash{color:#1d72b8}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:30;pointer-events:none}
  .toast.show{opacity:1}

  .filters{display:none;gap:6px;flex-wrap:wrap;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line)}
  .filters.open{display:flex}

  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:5px}

  @media (max-width:820px){
    .modal{grid-template-columns:1fr}
    .modal .left{border-right:none;border-bottom:1px solid var(--line)}
    .modal .right{max-height:none}
    .day{min-height:74px}
    .day .chip .t,.day .chip .time{display:none}
    .week{grid-template-columns:1fr}
    .week .day{min-height:auto}
    .week .day .chip .t,.week .day .chip .time{display:block}
    .pipe{grid-template-columns:1fr}
    header h1{min-width:auto;font-size:16px}
  }
</style>
</head>
<body>

<header>
  <button class="ghost" id="prev" title="Anterior">‹</button>
  <h1 id="title"></h1>
  <button class="ghost" id="next" title="Siguiente">›</button>
  <button id="today">Hoy</button>
  <div class="spacer"></div>
  <div class="seg">
    <button data-view="pipeline">▦ Pipeline</button>
    <button data-view="month">📅 Mes</button>
    <button data-view="week">🗓 Semana</button>
  </div>
  <button id="toggleFilters">☰ Filtros</button>
  <button id="menuBtn" title="Copia de seguridad">⋯</button>
  <button class="primary" id="newBtn">+ Nuevo</button>
</header>
<div class="filters" id="filters"></div>

<main id="main"></main>

<!-- Editor -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="left">
      <h2 id="mTitle">Nuevo post</h2>
      <div style="font-size:12px;color:var(--muted)">Escríbelo una vez, mira cómo queda en cada red.</div>

      <label>Texto del post</label>
      <textarea id="fText" placeholder="Escribe aquí tu publicación... ✨"></textarea>
      <div class="counter" id="fCount">0 caracteres</div>

      <label>Imagen (opcional)</label>
      <input type="file" id="fImg" accept="image/*">
      <div class="imgprev" id="fImgPrev"></div>

      <label>Redes donde se publica</label>
      <div class="nets" id="fNets"></div>

      <div class="row">
        <div><label>Fecha</label><input type="date" id="fDate"></div>
        <div><label>Hora</label><input type="time" id="fTime"></div>
      </div>

      <label>Estado</label>
      <select id="fStatus">
        <option value="idea">💡 Idea / borrador</option>
        <option value="scheduled">⏰ Programado</option>
        <option value="published">✅ Publicado</option>
      </select>

      <div class="actions">
        <button class="primary" id="saveBtn">Guardar</button>
        <button id="dupBtn">Duplicar</button>
        <button id="cancelBtn">Cancelar</button>
        <div class="spacer"></div>
        <button class="danger" id="delBtn">Eliminar</button>
      </div>
    </div>
    <div class="right">
      <div class="tabs" id="pvTabs"></div>
      <div id="pvBody"></div>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept="application/json" hidden>
<div class="toast" id="toast"></div>

<script>
/* ============ Configuración de redes ============ */
const NETWORKS = {
  instagram:{name:"Instagram", color:"#d6249f", limit:2200, hashtags:30, icon:"📸"},
  facebook: {name:"Facebook",  color:"#1877f2", limit:63206, icon:"👍"},
  tiktok:   {name:"TikTok",    color:"#111111", limit:2200, icon:"🎵"},
  x:        {name:"X",         color:"#555555", limit:280,  icon:"✖️"},
  threads:  {name:"Threads",   color:"#7a4fd6", limit:500,  icon:"🧵"},
  linkedin: {name:"LinkedIn",  color:"#0a66c2", limit:3000, icon:"💼"},
  youtube:  {name:"YouTube",   color:"#ff0000", limit:5000, icon:"▶️"},
  pinterest:{name:"Pinterest", color:"#e60023", limit:500,  icon:"📌"},
};
const STATUS = {
  idea:{label:"Ideas / borradores", color:"#b8aca6"},
  scheduled:{label:"Programados", color:"#e2a33b"},
  published:{label:"Publicados", color:"#2ea866"},
};
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DOW = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];

/* ============ Estado ============ */
const KEY = "planificador-redes-v1";
let posts = load();
let view = localStorage.getItem(KEY+"-view") || "month";
let cursor = new Date(); cursor.setHours(0,0,0,0);
let activeFilters = new Set(Object.keys(NETWORKS));
let editing = null;   // copia del post en edición
let pvTab = null;

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch{ return []; } }
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(posts)); }
  catch(e){ toast("⚠️ Memoria llena: usa imágenes más pequeñas o exporta y borra posts antiguos"); }
}
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2200); }
function textFor(p, net){ return (p.custom && p.custom[net]) || p.text || ""; }
function snippet(p){ return (p.text||"").split("\n")[0].slice(0,60) || "(sin texto)"; }
function visible(p){ return p.networks.length===0 || p.networks.some(n=>activeFilters.has(n)); }
function postsOn(dateStr){ return posts.filter(p=>p.date===dateStr && visible(p)).sort((a,b)=>(a.time||"").localeCompare(b.time||"")); }
function startOfWeek(d){ const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }

/* ============ Render principal ============ */
function render(){
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active", b.dataset.view===view));
  const main = $("#main");
  if(view==="month") renderMonth(main);
  else if(view==="week") renderWeek(main);
  else renderPipeline(main);
}

function chipHTML(p){
  const dots = p.networks.map(n=>`<span class="dot" style="background:${NETWORKS[n].color}" title="${NETWORKS[n].name}"></span>`).join("");
  return `<div class="chip" data-id="${p.id}">
    <span class="status-dot" style="background:${STATUS[p.status].color}"></span>
    ${p.image?`<img src="${p.image}" alt="">`:""}
    <span class="t">${esc(snippet(p))}<br><span class="time">${p.time||""}</span></span>
    <span class="dots">${dots}</span></div>`;
}
function legend(){
  return `<div class="legend">${Object.entries(STATUS).map(([k,s])=>`<span><i class="status-dot" style="background:${s.color}"></i>${s.label}</span>`).join("")}</div>`;
}

function renderMonth(main){
  const y=cursor.getFullYear(), m=cursor.getMonth();
  $("#title").textContent = `${MONTHS[m]} ${y}`;
  const first = startOfWeek(new Date(y,m,1));
  const todayStr = ymd(new Date());
  let html = legend() + `<div class="grid">` + DOW.map(d=>`<div class="dow">${d}</div>`).join("");
  const d = new Date(first);
  for(let i=0;i<42;i++){
    if(i===35 && d.getMonth()!==m) break;
    const ds = ymd(d), list = postsOn(ds), MAX=3;
    html += `<div class="day ${d.getMonth()!==m?"other":""} ${ds===todayStr?"today":""}" data-date="${ds}">
      <div class="num"><span>${d.getDate()}</span>${list.length?`<span>${list.length}</span>`:""}</div>
      ${list.slice(0,MAX).map(chipHTML).join("")}
      ${list.length>MAX?`<div class="more">+${list.length-MAX} más</div>`:""}
    </div>`;
    d.setDate(d.getDate()+1);
  }
  main.innerHTML = html + `</div>`;
}

function renderWeek(main){
  const s = startOfWeek(cursor), e = new Date(s); e.setDate(e.getDate()+6);
  $("#title").textContent = `${s.getDate()} ${MONTHS[s.getMonth()].slice(0,3)} – ${e.getDate()} ${MONTHS[e.getMonth()].slice(0,3)} ${e.getFullYear()}`;
  const todayStr = ymd(new Date());
  let html = legend() + `<div class="week">`;
  const d = new Date(s);
  for(let i=0;i<7;i++){
    const ds=ymd(d);
    html += `<div class="day ${ds===todayStr?"today":""}" data-date="${ds}">
      <div class="num"><span>${DOW[i]} ${d.getDate()}</span></div>
      ${postsOn(ds).map(chipHTML).join("")}</div>`;
    d.setDate(d.getDate()+1);
  }
  main.innerHTML = html + `</div>`;
}

function renderPipeline(main){
  $("#title").textContent = "Pipeline de contenido";
  const sorted = posts.filter(visible).sort((a,b)=>((a.date||"9")+(a.time||"")).localeCompare((b.date||"9")+(b.time||"")));
  main.innerHTML = `<div class="pipe">` + Object.entries(STATUS).map(([k,s])=>{
    const list = sorted.filter(p=>p.status===k);
    return `<div class="col"><h3><span>${s.label}</span><span>${list.length}</span></h3>
      ${list.map(p=>`<div class="card" data-id="${p.id}">
        ${p.image?`<img src="${p.image}" style="width:100%;max-height:120px;object-fit:cover;border-radius:6px;margin-bottom:6px">`:""}
        <div>${esc((p.text||"(sin texto)").slice(0,120))}</div>
        <div class="meta"><span>${p.date?`${p.date} ${p.time||""}`:"Sin fecha"}</span>
        <span class="dots">${p.networks.map(n=>`<span class="dot" style="background:${NETWORKS[n].color}"></span>`).join("")}</span></div>
      </div>`).join("") || `<div style="color:var(--muted);font-size:12px;padding:6px">Nada aquí todavía</div>`}
    </div>`;
  }).join("") + `</div>`;
}

/* ============ Editor ============ */
function openEditor(post, dateStr){
  editing = post ? JSON.parse(JSON.stringify(post)) : {
    id:null, text:"", image:null, networks:["instagram","facebook"],
    date: dateStr || ymd(new Date()), time:"10:00", status:"scheduled", custom:{}, done:{}
  };
  editing.custom ||= {}; editing.done ||= {};
  $("#mTitle").textContent = post ? "Editar post" : "Nuevo post";
  $("#fText").value = editing.text;
  $("#fDate").value = editing.date || "";
  $("#fTime").value = editing.time || "";
  $("#fStatus").value = editing.status;
  $("#fImg").value = "";
  $("#delBtn").style.display = post ? "" : "none";
  $("#dupBtn").style.display = post ? "" : "none";
  pvTab = editing.networks[0] || null;
  renderNets(); renderImg(); updateCount(); renderPreview();
  $("#overlay").classList.add("open");
  setTimeout(()=>$("#fText").focus(), 50);
}
function closeEditor(){ $("#overlay").classList.remove("open"); editing=null; }

function renderNets(){
  $("#fNets").innerHTML = Object.entries(NETWORKS).map(([k,n])=>{
    const on = editing.networks.includes(k);
    return `<button class="net-btn ${on?"on":""}" data-net="${k}" style="${on?`background:${n.color};border-color:${n.color}`:""}">${n.icon} ${n.name}</button>`;
  }).join("");
}
function renderImg(){
  $("#fImgPrev").innerHTML = editing.image ? `<img src="${editing.image}"><button id="rmImg">Quitar imagen</button>` : "";
}
function updateCount(){
  const t = $("#fText").value;
  const tags = (t.match(/#[\p{L}\p{N}_]+/gu)||[]).length;
  $("#fCount").textContent = `${t.length} caracteres · ${tags} hashtags`;
}

function highlight(text, limit){
  const fmt = s => esc(s).replace(/(#[\p{L}\p{N}_]+|@[\w.]+)/gu,'<span class="hash">$1</span>');
  if(text.length<=limit) return fmt(text);
  return fmt(text.slice(0,limit)) + `<span class="cut">${fmt(text.slice(limit))}</span>`;
}

function renderPreview(){
  const nets = editing.networks;
  if(!nets.length){ $("#pvTabs").innerHTML=""; $("#pvBody").innerHTML=`<div style="color:var(--muted);text-align:center;padding:40px">Elige al menos una red para ver la vista previa 👈</div>`; return; }
  if(!nets.includes(pvTab)) pvTab = nets[0];
  $("#pvTabs").innerHTML = nets.map(k=>{
    const n=NETWORKS[k], over = textFor(editing,k).length>n.limit;
    return `<button class="${k===pvTab?"active":""}" data-tab="${k}">${n.icon} ${n.name}${over?" ⚠️":""}${editing.done[k]?" ✅":""}</button>`;
  }).join("");

  const k = pvTab, n = NETWORKS[k], txt = textFor(editing,k);
  const when = editing.date ? new Date(editing.date+"T"+(editing.time||"00:00")).toLocaleString("es",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "Sin fecha";
  const img = editing.image ? `<img class="pv-img" src="${editing.image}">` : `<div class="pv-img ph">Sin imagen</div>`;
  const textBlock = `<div class="pv-text">${highlight(txt, n.limit)}</div>`;
  const head = `<div class="pv-head"><div class="avatar"></div><div><div class="pv-name">Mi emprendimiento</div><div class="pv-sub">${n.name} · ${when}</div></div></div>`;
  // Orden imagen/texto según la red
  const imageFirst = ["instagram","tiktok","pinterest","youtube"].includes(k);
  let card = `<div class="preview" style="border-top:4px solid ${n.color}">${head}${imageFirst?img+textBlock:textBlock+(editing.image?img:"")}</div>`;

  let notes = [];
  if(txt.length>n.limit) notes.push(`<div class="warn">⚠️ Te pasaste por <b>${txt.length-n.limit}</b> caracteres (máximo ${n.limit} en ${n.name}). Lo marcado en rojo no se verá. Escribe una versión corta abajo.</div>`);
  if(n.hashtags){ const h=(txt.match(/#[\p{L}\p{N}_]+/gu)||[]).length; if(h>n.hashtags) notes.push(`<div class="warn">⚠️ ${n.name} permite máximo ${n.hashtags} hashtags y tienes ${h}.</div>`); }
  if(["instagram","tiktok","pinterest","youtube"].includes(k) && !editing.image) notes.push(`<div class="warn">📷 ${n.name} necesita imagen o video para publicar.</div>`);
  if(!notes.length) notes.push(`<div class="ok">✓ Se ve bien en ${n.name} (${txt.length}/${n.limit})</div>`);

  const customBox = `<div class="custom-box"><label>Versión especial para ${n.name} (opcional)</label>
    <textarea id="customText" placeholder="Déjalo vacío para usar el texto principal">${esc(editing.custom[k]||"")}</textarea></div>`;
  const pub = `<div class="pubrow">
    <button id="copyBtn">📋 Copiar texto para ${n.name}</button>
    <label style="margin:0;display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)">
      <input type="checkbox" id="doneChk" style="width:auto" ${editing.done[k]?"checked":""}> Ya lo subí aquí</label></div>`;
  $("#pvBody").innerHTML = card + notes.join("") + pub + customBox;
}

function readForm(){
  editing.text = $("#fText").value;
  editing.date = $("#fDate").value;
  editing.time = $("#fTime").value;
  editing.status = $("#fStatus").value;
}

function resizeImage(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const max=900, s=Math.min(1, max/Math.max(im.width,im.height));
      const c=document.createElement("canvas"); c.width=im.width*s; c.height=im.height*s;
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.8)); }; im.onerror=rej; im.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}

/* ============ Eventos ============ */
$("#main").addEventListener("click", e=>{
  const chip = e.target.closest("[data-id]");
  if(chip){ openEditor(posts.find(p=>p.id===chip.dataset.id)); return; }
  const day = e.target.closest("[data-date]");
  if(day) openEditor(null, day.dataset.date);
});
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ view=b.dataset.view; localStorage.setItem(KEY+"-view",view); render(); });
$("#prev").onclick=()=>{ view==="week"?cursor.setDate(cursor.getDate()-7):cursor.setMonth(cursor.getMonth()-1,1); render(); };
$("#next").onclick=()=>{ view==="week"?cursor.setDate(cursor.getDate()+7):cursor.setMonth(cursor.getMonth()+1,1); render(); };
$("#today").onclick=()=>{ cursor=new Date(); cursor.setHours(0,0,0,0); render(); };
$("#newBtn").onclick=()=>openEditor(null);

// Filtros
function renderFilters(){
  $("#filters").innerHTML = Object.entries(NETWORKS).map(([k,n])=>{
    const on=activeFilters.has(k);
    return `<button class="net-btn ${on?"on":""}" data-filter="${k}" style="${on?`background:${n.color};border-color:${n.color}`:""}">${n.icon} ${n.name}</button>`;
  }).join("");
}
$("#toggleFilters").onclick=()=>$("#filters").classList.toggle("open");
$("#filters").onclick=e=>{ const b=e.target.closest("[data-filter]"); if(!b) return;
  const k=b.dataset.filter; activeFilters.has(k)?activeFilters.delete(k):activeFilters.add(k); renderFilters(); render(); };

// Editor
$("#fText").addEventListener("input", ()=>{ readForm(); updateCount(); renderPreview(); });
["#fDate","#fTime","#fStatus"].forEach(s=>$(s).addEventListener("change", ()=>{ readForm(); renderPreview(); }));
$("#fNets").onclick=e=>{ const b=e.target.closest("[data-net]"); if(!b) return; const k=b.dataset.net;
  editing.networks = editing.networks.includes(k) ? editing.networks.filter(x=>x!==k) : [...editing.networks,k];
  if(editing.networks.includes(k)) pvTab=k; renderNets(); renderPreview(); };
$("#fImg").onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
  try{ editing.image = await resizeImage(f); renderImg(); renderPreview(); }catch{ toast("No pude leer esa imagen"); } };
$("#fImgPrev").onclick=e=>{ if(e.target.id==="rmImg"){ editing.image=null; renderImg(); renderPreview(); } };
$("#pvTabs").onclick=e=>{ const b=e.target.closest("[data-tab]"); if(b){ pvTab=b.dataset.tab; renderPreview(); } };
$("#pvBody").addEventListener("input", e=>{
  if(e.target.id==="customText"){ const v=e.target.value; if(v.trim()) editing.custom[pvTab]=v; else delete editing.custom[pvTab];
    // refrescar solo la tarjeta sin perder el foco
    const pos=e.target.selectionStart; renderPreview(); const ta=$("#customText"); ta.focus(); ta.setSelectionRange(pos,pos); }
});
$("#pvBody").addEventListener("change", e=>{
  if(e.target.id==="doneChk"){ editing.done[pvTab]=e.target.checked;
    if(editing.networks.length && editing.networks.every(n=>editing.done[n])){ editing.status="published"; $("#fStatus").value="published"; toast("🎉 Subido en todas sus redes: marcado como publicado"); }
    renderPreview(); }
});
$("#pvBody").addEventListener("click", async e=>{
  if(e.target.id==="copyBtn"){
    const t=textFor(editing,pvTab);
    try{ await navigator.clipboard.writeText(t); toast("Texto copiado ✓ Pégalo en "+NETWORKS[pvTab].name); }
    catch{ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Texto copiado ✓"); }
  }
});
$("#saveBtn").onclick=()=>{
  readForm();
  if(!editing.text.trim() && !editing.image){ toast("Escribe algo o sube una imagen"); return; }
  if(editing.id){ posts = posts.map(p=>p.id===editing.id?editing:p); }
  else { editing.id=uid(); posts.push(editing); }
  if(editing.date){ cursor = new Date(editing.date+"T00:00"); }
  save(); closeEditor(); render(); toast("Guardado ✓");
};
$("#dupBtn").onclick=()=>{ readForm(); const c={...JSON.parse(JSON.stringify(editing)), id:uid(), done:{}, status:"idea"};
  posts.push(c); save(); render(); openEditor(c); toast("Copia creada: cambia la fecha y guarda"); };
$("#delBtn").onclick=()=>{ if(!confirm("¿Eliminar este post?")) return; posts=posts.filter(p=>p.id!==editing.id); save(); closeEditor(); render(); toast("Eliminado"); };
$("#cancelBtn").onclick=closeEditor;
$("#overlay").onclick=e=>{ if(e.target.id==="overlay") closeEditor(); };
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && editing) closeEditor(); });

// Copias de seguridad
$("#menuBtn").onclick=()=>{
  const op = prompt("Copia de seguridad:\n1 = Descargar mis posts\n2 = Cargar posts desde un archivo\n\nEscribe 1 o 2:");
  if(op==="1"){ const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(posts,null,1)],{type:"application/json"}));
    a.download=`mis-posts-${ymd(new Date())}.json`; a.click(); toast("Archivo descargado ✓"); }
  else if(op==="2") $("#importFile").click();
};
$("#importFile").onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
  try{ const data=JSON.parse(await f.text()); if(!Array.isArray(data)) throw 0;
    const ids=new Set(posts.map(p=>p.id)); data.forEach(p=>{ if(p&&p.id&&!ids.has(p.id)) posts.push(p); });
    save(); render(); toast(`Cargados ${data.length} posts ✓`); }
  catch{ toast("Ese archivo no es una copia válida"); }
  e.target.value=""; };

// Ejemplos la primera vez
if(!posts.length && !localStorage.getItem(KEY+"-seeded")){
  const t=new Date(), add=n=>{ const d=new Date(t); d.setDate(d.getDate()+n); return ymd(d); };
  posts = [
    {id:uid(),text:"¡Buenos días! ☀️ Hoy les cuento cómo empecé mi emprendimiento siendo mamá de dos 💛\n\n#emprendimiento #mamaemprendedora",networks:["instagram","facebook","threads"],date:add(0),time:"09:30",status:"scheduled",custom:{},done:{},image:null},
    {id:uid(),text:"3 errores que cometí al empezar en redes (y cómo los solucioné) 👇",networks:["instagram","tiktok","x"],date:add(2),time:"19:00",status:"idea",custom:{},done:{},image:null},
    {id:uid(),text:"Gracias a todas por el cariño de esta semana 🙏",networks:["facebook"],date:add(-2),time:"20:00",status:"published",custom:{},done:{facebook:true},image:null},
  ];
  localStorage.setItem(KEY+"-seeded","1"); save();
}

renderFilters(); render();
</script>
