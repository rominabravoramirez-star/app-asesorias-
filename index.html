<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Romina Bravo · Reserva tu asesoría</title>
<meta name="description" content="Gestión de redes sociales para tu negocio. Reserva tu reunión con Romina Bravo.">
<meta name="theme-color" content="#FBF6F1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#FBF6F1; --tarjeta:#FFFFFF; --rosa:#F6E3DA; --rosa-fuerte:#EBC4B4;
    --acento:#D9765F; --acento-osc:#C2604A; --verde:#2F4A3F; --texto:#4A4440; --suave:#8C817A;
    --borde:#EFE2DA; --radio:20px; --sombra:0 6px 24px rgba(120,80,60,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Nunito',system-ui,sans-serif;background:var(--fondo);color:var(--texto);line-height:1.5;
       background-image:radial-gradient(circle at 0% 0%,#F6E3DA 0,transparent 40%),radial-gradient(circle at 100% 100%,#E4EBE3 0,transparent 35%);
       background-attachment:fixed;min-height:100vh}
  .contenedor{max-width:480px;margin:0 auto;padding:32px 18px 48px}
  h1,h2,h3{font-family:'Playfair Display',Georgia,serif;color:var(--verde);line-height:1.2}
  button{font-family:inherit;cursor:pointer;border:none}

  /* Perfil */
  .perfil{text-align:center;margin-bottom:28px}
  .foto{width:120px;height:120px;border-radius:50%;margin:0 auto 14px;border:4px solid #fff;box-shadow:var(--sombra);
        background:linear-gradient(135deg,var(--rosa-fuerte),var(--acento));display:flex;align-items:center;justify-content:center;
        color:#fff;font-family:'Playfair Display',serif;font-size:40px;overflow:hidden}
  .foto img{width:100%;height:100%;object-fit:cover}
  .perfil h1{font-size:30px}
  .etiqueta{display:inline-block;margin:6px 0 12px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acento)}
  .bio{font-size:16px;max-width:380px;margin:0 auto}
  .redes{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
  .btn-red{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:#fff;color:var(--verde);
           text-decoration:none;font-weight:700;font-size:14px;box-shadow:var(--sombra);border:1px solid var(--borde)}
  .btn-red svg{width:18px;height:18px}

  /* Servicios */
  .titulo-seccion{font-size:22px;text-align:center;margin:8px 0 16px}
  .seccion{margin:34px 0 18px;text-align:center}
  .seccion:first-child{margin-top:4px}
  .seccion .pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
       color:#fff;background:var(--verde);padding:5px 14px;border-radius:999px;margin-bottom:10px}
  .seccion h2{font-size:24px;margin-bottom:6px}
  .seccion p{font-size:15px;color:var(--suave);max-width:360px;margin:0 auto}
  .precio.cotiza{font-size:20px}
  .chip.gratis{background:#E4EBE3;color:var(--verde)}
  .intro{text-align:center;margin:4px 0 20px}
  .lanzamiento{background:linear-gradient(135deg,var(--acento),#E89A84);color:#fff;border-radius:16px;padding:12px 16px;
       text-align:center;font-weight:700;font-size:15px;margin-bottom:22px;box-shadow:0 4px 14px rgba(217,118,95,.3)}
  .chip.oferta{background:var(--acento);color:#fff}
  #productos{margin-top:34px}
  .producto{background:linear-gradient(135deg,#fff,var(--rosa));border-radius:var(--radio);padding:22px 20px;margin-bottom:16px;
       box-shadow:var(--sombra);border:1px solid var(--rosa-fuerte)}
  .producto .tipo{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acento-osc)}
  .producto h3{font-size:20px;margin:6px 0}
  .producto p{font-size:14.5px;color:var(--texto);margin-bottom:14px}
  .producto .precio-prod small{display:block;font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;color:var(--suave)}
  .producto .precio-prod{font-family:'Playfair Display',serif;font-size:24px;color:var(--verde);font-weight:700;margin-bottom:12px}
  .btn.btn-hotmart{display:block;text-align:center;text-decoration:none;background:var(--verde);box-shadow:0 4px 14px rgba(47,74,63,.3)}
  .btn.btn-hotmart:hover{background:#243A31}
  .intro h2{font-size:24px;margin-bottom:6px}
  .intro p{font-size:15px;color:var(--suave);max-width:360px;margin:0 auto}
  .packs{border-top:1px solid var(--borde);margin:4px 0 12px}
  .pack{padding:12px 0;border-bottom:1px solid var(--borde)}
  .pack-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .pack-top b{color:var(--verde);font-size:15.5px}
  .pack-precio{font-weight:700;color:var(--acento-osc);font-size:15.5px;white-space:nowrap;text-align:right}
  .pack-precio small{font-size:12px;font-weight:600;color:var(--suave)}
  .pack-bot{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--suave);margin-top:2px;line-height:1.4}
  .pack-usd{white-space:nowrap;text-align:right;font-size:12.5px}
  .pack-nota{font-size:13px;color:var(--suave);background:var(--fondo);border-radius:12px;padding:10px 12px;margin-bottom:14px}
  .servicio{background:var(--tarjeta);border-radius:var(--radio);padding:22px 20px;margin-bottom:16px;box-shadow:var(--sombra);
            border:1px solid var(--borde);position:relative}
  .servicio.destacado{border:2px solid var(--acento)}
  .cinta{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--acento);color:#fff;font-size:12px;
         font-weight:700;padding:4px 14px;border-radius:999px;white-space:nowrap}
  .servicio h3{font-size:21px;margin-bottom:4px}
  .servicio .desc{font-size:14.5px;color:var(--suave);margin-bottom:12px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{font-size:13px;font-weight:700;background:var(--rosa);color:var(--acento-osc);padding:4px 12px;border-radius:999px}
  .incluye{list-style:none;font-size:14px;margin-bottom:16px}
  .incluye li{padding-left:22px;position:relative;margin-bottom:4px}
  .incluye li::before{content:'✓';position:absolute;left:0;color:var(--acento);font-weight:700}
  .fila-precio{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .precio{font-family:'Playfair Display',serif;font-size:26px;color:var(--verde);font-weight:700;line-height:1}
  .precio small{font-family:'Nunito',sans-serif;font-size:13px;color:var(--suave);font-weight:600}
  .precio .usd{display:block;font-family:'Nunito',sans-serif;font-size:13px;color:var(--suave);font-weight:600;margin-top:4px}
  .btn{background:var(--acento);color:#fff;font-weight:700;font-size:16px;padding:14px 24px;border-radius:999px;
       box-shadow:0 4px 14px rgba(217,118,95,.35);transition:transform .15s,background .15s}
  .btn:active{transform:scale(.97)} .btn:hover{background:var(--acento-osc)}
  .btn:disabled{background:#DCCBC3;box-shadow:none;cursor:not-allowed}
  .btn-bloque{width:100%}
  .btn-sec{background:transparent;color:var(--verde);font-weight:700;padding:10px 0;font-size:15px}
  .nota{font-size:13px;color:var(--suave);text-align:center;margin-top:6px}
  footer{text-align:center;font-size:13px;color:var(--suave);margin-top:30px}

  /* Panel de reserva */
  .panel{position:fixed;inset:0;background:rgba(47,74,63,.35);display:none;z-index:50;align-items:flex-end;justify-content:center}
  .panel.abierto{display:flex}
  .hoja{background:var(--fondo);width:100%;max-width:520px;max-height:94vh;overflow-y:auto;border-radius:24px 24px 0 0;
        padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:subir .25s ease-out}
  @media(min-width:600px){.panel{align-items:center}.hoja{border-radius:24px}}
  @keyframes subir{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .hoja-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .cerrar{background:#fff;width:38px;height:38px;border-radius:50%;font-size:20px;color:var(--verde);box-shadow:var(--sombra)}
  .resumen{background:#fff;border-radius:16px;padding:12px 16px;margin:10px 0 16px;border:1px solid var(--borde);font-size:14px}
  .resumen b{color:var(--verde)}
  .pasos{font-size:13px;font-weight:700;color:var(--acento);text-transform:uppercase;letter-spacing:.06em}

  .cal{background:#fff;border-radius:18px;padding:14px;border:1px solid var(--borde)}
  .cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-top h4{font-family:'Playfair Display',serif;color:var(--verde);font-size:18px}
  .nav{background:var(--rosa);color:var(--acento-osc);width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:700}
  .nav:disabled{opacity:.35;cursor:default}
  .grilla{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .dsem{font-size:12px;font-weight:700;color:var(--suave);padding:4px 0}
  .dia{height:40px;width:40px;margin:0 auto;border-radius:50%;font-size:15px;font-weight:600;background:transparent;color:#C9BDB6;display:flex;align-items:center;justify-content:center}
  .dia.disp{background:var(--rosa);color:var(--acento-osc);font-weight:700}
  .dia.sel{background:var(--acento);color:#fff}
  .zona{font-size:13px;color:var(--suave);margin:12px 2px 6px}
  .horas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
  .hora{background:#fff;border:2px solid var(--rosa-fuerte);color:var(--verde);border-radius:14px;padding:10px 6px;font-weight:700;font-size:16px}
  .hora small{display:block;font-weight:600;font-size:12px;color:var(--suave)}
  .hora.sel{background:var(--acento);border-color:var(--acento);color:#fff}
  .hora.sel small{color:#FBE3DB}
  .vacio{font-size:14px;color:var(--suave);text-align:center;padding:14px}

  form label{display:block;font-weight:700;font-size:14px;color:var(--verde);margin:14px 0 6px}
  form input,form textarea,form select{width:100%;font-family:inherit;font-size:16px;padding:13px 14px;border-radius:14px;
       border:1.5px solid var(--borde);background:#fff;color:var(--texto)}
  form input:focus,form textarea:focus,form select:focus{outline:none;border-color:var(--acento)}
  form textarea{min-height:110px;resize:vertical}
  .oculto{display:none!important}
  .error{color:#B3412E;font-size:14px;margin-top:10px;text-align:center}
  .exito{text-align:center;padding:10px 4px}
  .exito .icono{font-size:52px}
  .exito h3{font-size:24px;margin:6px 0 10px}
  .exito p{margin-bottom:14px}
  .btn-mp{background:#009EE3;box-shadow:0 4px 14px rgba(0,158,227,.35);display:block;text-decoration:none;text-align:center;margin-bottom:10px}
  .btn-mp:hover{background:#0087C2}
  .btn-wsp{background:#25D366;box-shadow:0 4px 14px rgba(37,211,102,.3);display:block;text-decoration:none;text-align:center}
  .btn-wsp:hover{background:#1EB858}
</style>
</head>
<body>

<div class="contenedor">
  <header class="perfil">
    <div class="foto" id="foto">RB</div>
    <h1 id="nombre"></h1>
    <div class="etiqueta" id="etiqueta"></div>
    <p class="bio" id="bio"></p>
    <div class="redes" id="redes"></div>
  </header>

  <main>
    <div class="lanzamiento oculto" id="lanzamiento"></div>
    <div class="intro">
      <h2>Elige tu servicio</h2>
      <p>Tu primera reunión es <b>gratis</b>: conversamos tu proyecto y te recomiendo el pack ideal para ti.</p>
    </div>
    <div id="servicios"></div>
    <p class="nota" id="nota-general"></p>
    <section id="productos" class="oculto"></section>
  </main>

  <footer id="pie"></footer>
</div>

<!-- Panel de reserva -->
<div class="panel" id="panel" aria-hidden="true">
  <div class="hoja" role="dialog" aria-modal="true" aria-labelledby="titulo-reserva">
    <div class="hoja-top">
      <span class="pasos" id="paso-txt">Paso 1 de 2</span>
      <button class="cerrar" id="cerrar" aria-label="Cerrar">×</button>
    </div>
    <h2 id="titulo-reserva" style="font-size:22px">Elige día y hora</h2>
    <div class="resumen" id="resumen"></div>

    <!-- Paso 1: calendario -->
    <section id="paso1">
      <div class="cal">
        <div class="cal-top">
          <button class="nav" id="mes-ant" aria-label="Mes anterior">‹</button>
          <h4 id="mes-txt"></h4>
          <button class="nav" id="mes-sig" aria-label="Mes siguiente">›</button>
        </div>
        <div class="grilla" id="grilla"></div>
      </div>
      <p class="zona" id="zona-txt"></p>
      <div id="horas-box"></div>
      <button class="btn btn-bloque" id="continuar" style="margin-top:18px" disabled>Continuar</button>
    </section>

    <!-- Paso 2: datos -->
    <section id="paso2" class="oculto">
      <form id="formulario" novalidate>
        <label for="f-nombre">Tu nombre *</label>
        <input id="f-nombre" name="nombre" autocomplete="name" required>
        <label for="f-correo">Tu correo *</label>
        <input id="f-correo" name="correo" type="email" autocomplete="email" inputmode="email" required>
        <label for="f-wsp">Tu WhatsApp (opcional)</label>
        <input id="f-wsp" name="whatsapp" type="tel" autocomplete="tel" inputmode="tel" placeholder="+56 9 ...">
        <label for="f-plataforma">¿Por dónde prefieres la reunión? *</label>
        <select id="f-plataforma" name="plataforma" required></select>
        <label for="f-pack">¿Qué pack te interesa?</label>
        <select id="f-pack" name="pack"></select>
        <label for="f-tema">¿Qué te gustaría trabajar? *</label>
        <textarea id="f-tema" name="tema" required placeholder="Cuéntame de tu negocio y qué necesitas en tus redes"></textarea>
        <input type="text" name="_honey" id="f-honey" class="oculto" tabindex="-1" autocomplete="off">
        <p class="error oculto" id="error"></p>
        <button class="btn btn-bloque" type="submit" id="enviar" style="margin-top:20px">Confirmar reserva</button>
        <button class="btn-sec btn-bloque" type="button" id="volver">‹ Cambiar día u hora</button>
      </form>
    </section>

    <!-- Paso 3: listo -->
    <section id="paso3" class="oculto">
      <div class="exito">
        <div class="icono">🌸</div>
        <h3>¡Reserva recibida!</h3>
        <p id="exito-txt"></p>
        <a class="btn btn-wsp" id="btn-wsp-confirmar" target="_blank" rel="noopener">Escribirme por WhatsApp</a>
        <button class="btn-sec btn-bloque" id="listo" style="margin-top:8px">Volver al inicio</button>
      </div>
    </section>
  </div>
</div>

<script>

   ✏️  CONFIGURACIÓN — Esta es la ÚNICA parte que necesitas editar.

/* ---- Utilidades de zona horaria ---- */
function offsetMin(fecha, tz) {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23",
    year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" })
    .formatToParts(fecha).map(x => [x.type, x.value]));
  const comoUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second);
  return Math.round((comoUTC - fecha.getTime()) / 60000);
}
// Convierte "fecha y hora en Chile" a un instante real
function chileAInstante(y, m, d, h) {
  let t = Date.UTC(y, m - 1, d, h);
  let off = offsetMin(new Date(t), CONFIG.zonaHoraria);
  let real = t - off * 60000;
  const off2 = offsetMin(new Date(real), CONFIG.zonaHoraria);
  if (off2 !== off) real = t - off2 * 60000;
  return new Date(real);
}
function hoyEnChile() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: CONFIG.zonaHoraria,
    year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return { y: +p.year, m: +p.month, d: +p.day };
}
const fmtHora = (fecha, tz) => fecha.toLocaleTimeString("es-CL", { timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false });
const nombreZona = tz => tz.split("/").pop().replace(/_/g, " ");
const claveDia = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;

function horasDisponibles(y, m, d) {
  const diaSem = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
  if (!CONFIG.dias.includes(diaSem)) return [];
  const bloq = CONFIG.bloqueados[claveDia(y, m, d)];
  if (bloq === "todo") return [];
  const limite = Date.now() + CONFIG.anticipacionHoras * 3600000;
  const res = [];
  for (let h = CONFIG.horaInicio; h + CONFIG.duracionMin / 60 <= CONFIG.horaFin; h++) {
    const txt = `${pad(h)}:00`;
    if (Array.isArray(bloq) && bloq.includes(txt)) continue;
    const inst = chileAInstante(y, m, d, h);
    if (inst.getTime() >= limite) res.push({ chile: txt, inst });
  }
  return res;
}

/* ---- Estado de la reserva ---- */
let servicio = null, mesVista = null, diaSel = null, horaSel = null;
const HOY = hoyEnChile();
const MAX = new Date(Date.UTC(HOY.y, HOY.m - 1, HOY.d + CONFIG.diasHaciaAdelante));

function abrir(i) {
  servicio = CONFIG.servicios[i];
  diaSel = horaSel = null;
  mesVista = { y: HOY.y, m: HOY.m };
  // si este mes ya no tiene horas, saltar al siguiente
  if (!mesTieneHoras(mesVista)) { const s = sumarMes(mesVista, 1); if (mesTieneHoras(s)) mesVista = s; }
  $("formulario").reset();
  $("f-pack").innerHTML = servicio.packs.map(k => `<option>${k.nombre}</option>`).join("") + '<option selected>Aún no lo sé, quiero que me recomiendes</option>';
  $("f-plataforma").innerHTML = '<option value="">Elige una opción</option>' + CONFIG.plataformas.map(p => `<option>${p}</option>`).join("");
  mostrarPaso(1);
  pintarCalendario();
  $("panel").classList.add("abierto");
  $("panel").setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}
function cerrar() {
  $("panel").classList.remove("abierto");
  $("panel").setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}
$("cerrar").onclick = cerrar;
$("listo").onclick = cerrar;
$("panel").addEventListener("click", e => { if (e.target.id === "panel") cerrar(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrar(); });

function sumarMes({ y, m }, n) { const t = new Date(Date.UTC(y, m - 1 + n, 1)); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1 }; }
function diaPermitido(y, m, d) {
  const t = Date.UTC(y, m - 1, d);
  return t >= Date.UTC(HOY.y, HOY.m - 1, HOY.d) && t <= MAX.getTime();
}
function mesTieneHoras({ y, m }) {
  const n = new Date(Date.UTC(y, m, 0)).getUTCDate();
  for (let d = 1; d <= n; d++) if (diaPermitido(y, m, d) && horasDisponibles(y, m, d).length) return true;
  return false;
}

function actualizarResumen() {
  let txt = `<b>${servicio.nombre}</b> · ${CONFIG.duracionMin} min · Primera reunión gratis`;
  if (diaSel && horaSel) {
    const f = horaSel.inst.toLocaleDateString("es-CL", { timeZone: TZ_CLIENTE, weekday: "long", day: "numeric", month: "long" });
    txt += `<br>📅 <b>${cap(f)}</b>, ${fmtHora(horaSel.inst, TZ_CLIENTE)} hrs` +
           (MISMA_ZONA ? "" : ` (tu hora) · ${horaSel.chile} hrs en Chile`);
  }
  $("resumen").innerHTML = txt;
}

function pintarCalendario() {
  const { y, m } = mesVista;
  $("mes-txt").textContent = cap(new Date(Date.UTC(y, m - 1, 15)).toLocaleDateString("es-CL", { month: "long", timeZone: "UTC" })) + " " + y;
  $("mes-ant").disabled = (y === HOY.y && m === HOY.m);
  const sig = sumarMes(mesVista, 1);
  $("mes-sig").disabled = Date.UTC(sig.y, sig.m - 1, 1) > MAX.getTime();

  let html = ["L", "M", "M", "J", "V", "S", "D"].map(x => `<div class="dsem">${x}</div>`).join("");
  const primero = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;
  const total = new Date(Date.UTC(y, m, 0)).getUTCDate();
  for (let i = 0; i < primero; i++) html += "<div></div>";
  for (let d = 1; d <= total; d++) {
    const disp = diaPermitido(y, m, d) && horasDisponibles(y, m, d).length > 0;
    const sel = diaSel && diaSel.y === y && diaSel.m === m && diaSel.d === d;
    html += disp
      ? `<button class="dia disp ${sel ? "sel" : ""}" data-d="${d}" aria-label="${d}">${d}</button>`
      : `<div class="dia">${d}</div>`;
  }
  $("grilla").innerHTML = html;
  $("grilla").querySelectorAll("button.dia").forEach(b => b.onclick = () => {
    diaSel = { y, m, d: +b.dataset.d }; horaSel = null; pintarCalendario();
  });

  $("zona-txt").innerHTML = MISMA_ZONA
    ? `🌎 Horarios en hora de Chile (${nombreZona(CONFIG.zonaHoraria)})`
    : `🌎 Horarios en <b>tu zona horaria (${nombreZona(TZ_CLIENTE)})</b>. Debajo verás la hora de Chile.`;

  if (!diaSel) {
    $("horas-box").innerHTML = `<p class="vacio">${mesTieneHoras(mesVista) ? "Toca un día marcado para ver los horarios 💕" : "No quedan horarios este mes. Mira el mes siguiente ›"}</p>`;
  } else {
    const hs = horasDisponibles(diaSel.y, diaSel.m, diaSel.d);
    $("horas-box").innerHTML = `<div class="horas">` + hs.map((h, i) => `
      <button class="hora ${horaSel && horaSel.chile === h.chile ? "sel" : ""}" data-i="${i}">
        ${fmtHora(h.inst, TZ_CLIENTE)}${MISMA_ZONA ? "" : `<small>${h.chile} en Chile</small>`}
      </button>`).join("") + `</div>`;
    $("horas-box").querySelectorAll(".hora").forEach(b => b.onclick = () => { horaSel = hs[+b.dataset.i]; pintarCalendario(); });
  }
  $("continuar").disabled = !(diaSel && horaSel);
  actualizarResumen();
}
$("mes-ant").onclick = () => { mesVista = sumarMes(mesVista, -1); diaSel = horaSel = null; pintarCalendario(); };
$("mes-sig").onclick = () => { mesVista = sumarMes(mesVista, 1); diaSel = horaSel = null; pintarCalendario(); };

function mostrarPaso(n) {
  ["paso1", "paso2", "paso3"].forEach((id, i) => $(id).classList.toggle("oculto", i !== n - 1));
  $("paso-txt").textContent = n < 3 ? `Paso ${n} de 2` : "¡Listo!";
  $("titulo-reserva").textContent = ["Elige día y hora", "Tus datos", "¡Nos vemos pronto!"][n - 1];
  $("resumen").classList.toggle("oculto", n === 3);
  $("error").classList.add("oculto");
  document.querySelector(".hoja").scrollTop = 0;
}
$("continuar").onclick = () => mostrarPaso(2);
$("volver").onclick = () => mostrarPaso(1);

/* ---- Envío de la reserva a tu correo ---- */
$("formulario").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, err = $("error");
  const nombre = f.nombre.value.trim(), correo = f.correo.value.trim(), tema = f.tema.value.trim(), plat = f.plataforma.value;
  if (!nombre || !tema || !plat || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo)) {
    err.textContent = "Por favor completa tu nombre, un correo válido, la plataforma y lo que quieres trabajar.";
    err.classList.remove("oculto"); return;
  }
  if ($("f-honey").value) return; // spam

  const fechaChile = horaSel.inst.toLocaleDateString("es-CL", { timeZone: CONFIG.zonaHoraria, weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const datos = {
    _subject: `🌸 Nueva reserva: ${servicio.nombre} — ${nombre}`,
    _template: "table",
    _captcha: "false",
    _replyto: correo,
    "Servicio": servicio.nombre,
    "Pack de interés": f.pack.value,
    "Fecha (Chile)": fechaChile,
    "Hora (Chile)": `${horaSel.chile} hrs`,
    "Hora de la clienta": `${fmtHora(horaSel.inst, TZ_CLIENTE)} hrs (${TZ_CLIENTE})`,
    "Nombre": nombre,
    "Correo": correo,
    "WhatsApp": f.whatsapp.value.trim() || "—",
    "Plataforma": plat,
    "Qué quiere trabajar": tema,
  };

  const btn = $("enviar");
  btn.disabled = true; btn.textContent = "Enviando...";
  try {
    let r;
    if (CONFIG.web3formsKey) {
      // Web3Forms: envía la reserva a tu correo usando tu clave de acceso
      const w3 = { access_key: CONFIG.web3formsKey, subject: datos._subject, from_name: "Página de reservas", replyto: correo };
      Object.keys(datos).forEach(k => { if (!k.startsWith("_")) w3[k] = datos[k]; });
      r = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(w3),
      });
    } else {
      r = await fetch(`https://formsubmit.co/ajax/${CONFIG.formsubmitId || CONFIG.correo}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(datos),
      });
    }
    const j = await r.json().catch(() => ({}));
    if (!r.ok || String(j.success) === "false") {
      const e = new Error(j.message || "error");
      e.activacion = /activat/i.test(j.message || "");
      throw e;
    }

    const fCliente = horaSel.inst.toLocaleDateString("es-CL", { timeZone: TZ_CLIENTE, weekday: "long", day: "numeric", month: "long" });
    const apartado = `Gracias, <b>${nombre.split(" ")[0]}</b>. Apartamos el <b>${fCliente}</b> a las <b>${fmtHora(horaSel.inst, TZ_CLIENTE)} hrs</b> por ${plat}.<br><br>`;
    $("exito-txt").innerHTML = apartado + `Tu primera reunión es <b>gratuita</b>. Te escribiré a <b>${correo}</b> con el link de la reunión. ¡Nos vemos pronto!`;
    const msgWsp = `¡Hola Romina! Acabo de reservar una reunión de ${servicio.nombre} para el ${fCliente} a las ${horaSel.chile} (hora Chile). Mi nombre es ${nombre}. Te cuento un poco de mi proyecto:`;
    $("btn-wsp-confirmar").href = linkWsp(msgWsp);
    mostrarPaso(3);
  } catch (ex) {
    const wsp = `<a href="${linkWsp("Hola Romina, quiero reservar una reunión de " + servicio.nombre)}" target="_blank">escríbeme por WhatsApp</a>`;
    err.innerHTML = ex.activacion
      ? `Las reservas en línea se están activando en este momento. Por favor ${wsp} y agendamos tu reunión. 💛`
      : `Ups, no se pudo enviar. Revisa tu conexión e inténtalo otra vez, o ${wsp}.`;
    err.classList.remove("oculto");
  } finally {
    btn.disabled = false; btn.textContent = "Confirmar reserva";
  }
});
